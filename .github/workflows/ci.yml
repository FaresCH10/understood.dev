name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start isolated test database
        run: |
          docker run -d --name understood-test-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          docker run -d --name understood-test-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec understood-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec understood-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec understood-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: 'true'
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test:backup
      - run: npm run test:dev
      - run: npm run test --workspaces --if-present
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: npm run build --workspaces --if-present
